name: Go checks

on:
  push:
    branches:
      - main
      - feature/tutorial-encounters-item-aliases
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Build server
        run: go build ./cmd/fatewalker
